name: Dump VidSrc servers

# Temporary probe: lists the servers behind an embed, with the language
# fields intact, so dubbed servers can be told apart from plain ones.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma separated tmdb ids"
        default: "1399,2734,1726"
        required: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump
        run: |
          python - <<'PY'
          import re, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36")
          HEADERS = {
              "User-Agent": UA,
              "Referer": "https://cinestream-br-v2.github.io/",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "cross-site",
              "Upgrade-Insecure-Requests": "1",
          }
          IDS = "${{ github.event.inputs.ids || '1399,2734,1726' }}".split(",")

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.read(500_000).decode("utf-8", "replace")

          for tmdb in IDS:
              tmdb = tmdb.strip()
              if not tmdb:
                  continue
              for label, url in (("tv", f"https://vidsrc.buzz/embed/tv/{tmdb}/1/1"),
                                 ("movie", f"https://vidsrc.buzz/embed/movie/{tmdb}")):
                  try:
                      status, body = get(url)
                  except Exception as exc:
                      print(f"== {tmdb} {label}: ERROR {exc}")
                      continue
                  refs = re.findall(r'\{"ref":.*?"rm":(?:true|null)\}', body)
                  named = [r for r in refs if re.search(r'"(?:lang|ai|ad|sk)":"[^"]', r)]
                  print(f"== {tmdb} {label}: status={status} servers={len(refs)} with-language={len(named)}")
                  for entry in named:
                      print("    LANG", entry[:300])
                  if tmdb == IDS[0] and label == "tv":
                      # how the embed page turns a server into a stream
                      for pat in (r'"/api/[^"]{0,80}', r'fetch\([^)]{0,90}', r'XMLHttpRequest',
                                  r'URLSearchParams[^;]{0,80}', r'server[^,;]{0,60}'):
                          found = re.findall(pat, body)[:6]
                          if found:
                              print("    PAT", pat, "->", found)
          PY
