name: Dump VidSrc embed

# Temporary probe: fetches the raw embed page from a fresh runner IP and
# prints the server table, so the schema can be read without guessing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump
        run: |
          python - <<'PY'
          import json, re, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36")

          HEADERS = {
              "User-Agent": UA,
              "Referer": "https://cinestream-br-v2.github.io/",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "cross-site",
              "Upgrade-Insecure-Requests": "1",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.read(400_000).decode("utf-8", "replace")

          for kind, tmdb, season in (("tv", 2734, 1), ("tv", 1399, 1), ("movie", 1726, 0)):
              url = (f"https://vidsrc.buzz/embed/tv/{tmdb}/{season}/1" if kind == "tv"
                     else f"https://vidsrc.buzz/embed/movie/{tmdb}")
              try:
                  status, body = get(url)
              except Exception as exc:
                  print(f"== {kind}/{tmdb}: ERROR {exc}")
                  continue
              print(f"== {kind}/{tmdb}: status={status} bytes={len(body)} refs={body.count(chr(34) + 'ref' + chr(34))}")
              # every ref entry carries a server id and a label
              for match in re.finditer(r'\{[^{}]*"ref"[^{}]*\}', body):
                  print("   ", match.group(0)[:300])
              for word in ("dub", "Dub", "portugu", "Portug", "legend", "Legend", "audio", "lang"):
                  if word in body:
                      print(f"    contains {word!r}")
          PY
