name: Dump VidSrc API usage

# Temporary probe: prints the embed page code around its api.php calls so
# the request shape can be reproduced.

on:
  workflow_dispatch:
    inputs:
      id:
        description: "tmdb id"
        default: "1399"
        required: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump
        run: |
          python - <<'PY'
          import re, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36")
          HEADERS = {
              "User-Agent": UA,
              "Referer": "https://cinestream-br-v2.github.io/",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "cross-site",
              "Upgrade-Insecure-Requests": "1",
          }
          TMDB = "${{ github.event.inputs.id || '1399' }}"

          req = urllib.request.Request(
              f"https://vidsrc.buzz/embed/tv/{TMDB}/1/1", headers=HEADERS)
          with urllib.request.urlopen(req, timeout=25) as r:
              body = r.read(500_000).decode("utf-8", "replace")

          print("bytes", len(body))
          def show(label, pattern, before, after, limit=3):
              for index, match in enumerate(re.finditer(pattern, body)):
                  if index >= limit:
                      break
                  print(f"----- {label} #{index}")
                  print(body[max(0, match.start() - before):match.end() + after].replace("\\n", "\n"))

          show("audioPref", r"audioPref\s*=", 200, 700)
          show("qs build", r"qs\s*=", 400, 700)
          show("search params", r"searchParams|\.get\(", 250, 400, limit=6)
          show("sources call", r"api\.php\?a=sources", 900, 700)
          show("audioTracks def", r"function audioTracks", 100, 700)
          PY
