name: Refresh catalog

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch catalog
        run: python scripts/fetch_catalog.py --workers 6

      - name: Fill missing genres from IMDb
        continue-on-error: true
        run: |
          if [ -f data/genres.json ]; then
            python scripts/enrich_imdb_genres.py
          fi

      - name: Fetch episode counts
        continue-on-error: true
        run: |
          if [ -f data/episodes.json ]; then
            python scripts/fetch_episodes.py --workers 3
          fi

      - name: Measure episode counts on the player
        continue-on-error: true
        run: |
          if [ -f data/episode_counts.json ]; then
            python scripts/probe_episodes.py --workers 6
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: refresh catalog data"
            git push
          fi
