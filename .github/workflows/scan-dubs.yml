name: Scan VidSrc dubbed servers

# Temporary probe: sweeps titles and reports any server that advertises an
# audio language, plus the server names, which is where a dubbed track shows.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma separated tmdb ids"
        default: "1399,1726"
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan
        run: |
          python - <<'PY'
          import re, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36")
          HEADERS = {
              "User-Agent": UA,
              "Referer": "https://cinestream-br-v2.github.io/",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "cross-site",
              "Upgrade-Insecure-Requests": "1",
          }
          IDS = "${{ github.event.inputs.ids || '1399' }}".split(",")

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.read(600_000).decode("utf-8", "replace")

          for tmdb in IDS:
              tmdb = tmdb.strip()
              if not tmdb:
                  continue
              for label, url in (("tv", f"https://vidsrc.buzz/embed/tv/{tmdb}/1/1"),
                                 ("movie", f"https://vidsrc.buzz/embed/movie/{tmdb}")):
                  try:
                      status, body = get(url)
                  except Exception as exc:
                      print(f"{tmdb} {label}: ERROR {exc}")
                      continue
                  refs = re.findall(r'\{"ref":.*?"rm":(?:true|null)\}', body)
                  names = [re.search(r'"name":"([^"]*)"', r).group(1) for r in refs if re.search(r'"name":"([^"]*)"', r)]
                  tagged = [r for r in refs if re.search(r'"(?:lang|ai|ad|sk)":"[^"]', r)]
                  print(f"{tmdb} {label}: servers={len(refs)} names={names}")
                  for entry in tagged:
                      print(f"   TAGGED {entry[:300]}")
              # the ad preference the player honours
              try:
                  status, body = get(f"https://vidsrc.buzz/embed/tv/{tmdb}/1/1?ad=pt")
              except Exception:
                  continue
              refs = re.findall(r'\{"ref":.*?"rm":(?:true|null)\}', body)
              tagged = [r for r in refs if re.search(r'"(?:lang|ai|ad|sk)":"[^"]', r)]
              print(f"{tmdb} ad=pt: servers={len(refs)} tagged={len(tagged)}")
              for entry in tagged:
                  print(f"   TAGGED {entry[:300]}")
          PY
