name: Probe embed compatibility

# The TV runs a 2015 browser (Chrome 47). This checks whether the embed pages
# still use syntax that browser cannot parse.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          python - <<'PY'
          import re, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36")
          HEADERS = {
              "User-Agent": UA,
              "Referer": "https://cinestream-br-v2.github.io/",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
              "Sec-Fetch-Dest": "iframe",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "cross-site",
              "Upgrade-Insecure-Requests": "1",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read(900_000).decode("utf-8", "replace")

          for label, url in (
              ("filme", "https://vidsrc.buzz/embed/movie/157336"),
              ("serie", "https://vidsrc.buzz/embed/tv/1399/1/1"),
          ):
              body = get(url)
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", body, re.S)
              inline = "\n".join(scripts)
              extern = re.findall(r'<script[^>]+src="([^"]+)"', body)
              print(f"== {label} {url}")
              print(f"   bytes={len(body)} inline={len(inline)} external={len(extern)}")
              for name, count in (
                  ("arrow", len(re.findall(r"=>", inline))),
                  ("async", len(re.findall(r"\basync\b", inline))),
                  ("const", len(re.findall(r"\bconst\s", inline))),
                  ("let", len(re.findall(r"\blet\s", inline))),
                  ("class", len(re.findall(r"\bclass\s+\w", inline))),
                  ("template", inline.count("`")),
                  ("fetch(", inline.count("fetch(")),
                  ("optionalChain", inline.count("?.")),
              ):
                  if count:
                      print(f"     {name}: {count}")
              print("   externos:", extern[:6])
          PY
