name: Probe series availability

# The embed host rate-limits a single IP, so a full 10k-request crawl from one
# machine gets 403'd. Each run probes a small batch from a fresh runner IP and
# merges the result, so coverage grows steadily without hammering the host.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: How many series to probe in this run
        default: "120"
        required: false

permissions:
  contents: write

concurrency:
  group: probe-availability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe a batch
        env:
          BATCH: ${{ github.event.inputs.limit || '120' }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys

          path = "data/availability.json"
          data = json.load(open(path, encoding="utf-8"))
          cursor = int(data.get("cursor") or 0)
          batch = os.environ["BATCH"]
          print(f"cursor={cursor} batch={batch}")
          subprocess.run(
              [sys.executable, "scripts/probe_availability.py",
               "--offset", str(cursor), "--limit", batch,
               "--workers", "4", "--rate", "1.5", "--merge"],
              check=True,
          )
          updated = json.load(open(path, encoding="utf-8"))
          print(f"titles known: {updated.get('count')} cursor: {updated.get('cursor')}")
          PY

      - name: Validate
        run: |
          python - <<'PY'
          import json, sys

          data = json.load(open("data/availability.json", encoding="utf-8"))
          items = data.get("items") or {}
          bad = []

          # Items are {"<tmdb>": {"<source>": [season, ...]}}. A title may sit
          # under one source only; an empty list is dropped on write, so any
          # empty list here means the writer regressed.
          for key, entry in items.items():
              if not isinstance(entry, dict) or not entry:
                  bad.append(key)
                  continue
              for source, seasons in entry.items():
                  if not isinstance(seasons, list) or not seasons:
                      bad.append(f"{key}/{source}")
                  elif seasons != sorted(set(seasons)):
                      bad.append(f"{key}/{source}:unsorted")

          if bad:
              print("bad entries:", bad[:8])
              sys.exit(1)
          print(f"{len(items)} titles mapped across {len(data.get('sources') or [])} sources")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json
          if git diff --cached --quiet; then
            echo "No new availability data."
          else
            git commit -m "chore: extend series availability map"
            git push
          fi
