<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - Streaming</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --accent: #3b82f6;
      --header-height: 70px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .player-header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 20px;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .player-title {
      font-size: 1.1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .player-container {
      position: fixed;
      top: var(--header-height);
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-color);
    }

    .player-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 40px;
    }

    .error-message {
      color: #ef4444;
      margin-bottom: 16px;
    }

    .error-btn {
      padding: 10px 24px;
      background-color: var(--accent);
      color: var(--text-primary);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .player-header {
        padding: 0 12px;
      }

      .player-title {
        font-size: 0.95rem;
      }

      .back-btn {
        padding: 6px 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header class="player-header">
    <button class="back-btn" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5m7 7-7-7 7-7"/>
      </svg>
      Back
    </button>
    <div class="player-title" id="playerTitle">Loading...</div>
  </header>

  <main class="player-container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>Loading player...</span>
    </div>
    <div id="error" class="error" style="display: none;">
      <div class="error-message" id="errorMessage">Error loading player</div>
      <button class="error-btn" id="errorBtn">Back</button>
    </div>
    <iframe id="playerFrame" class="player-frame" style="display: none;" allow="autoplay; fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </main>

  <script>
    // Extract URL parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        url: params.get('url') || '',
        title: params.get('title') || 'Movie',
        type: params.get('type') || 'movie'
      };
    }

    // Block ads on the main page
    function blockAds() {
      // Remove any existing ad elements
      const ads = document.querySelectorAll('iframe[src*="ad"], iframe[src*="doubleclick"], iframe[src*="googlesyndication"], iframe[src*="ads"]');
      ads.forEach(ad => ad.remove());

      // Block new ad iframes from being added
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === 1) {
              const isAdFrame = node.tagName === 'IFRAME' && (
                node.src.includes('ad') ||
                node.src.includes('doubleclick') ||
                node.src.includes('googlesyndication') ||
                node.src.includes('ads') ||
                node.src.includes('popunder') ||
                node.src.includes('popover')
              );
              if (isAdFrame) {
                node.remove();
              }
            }
          });
        });
      });

      observer.observe(document.body, { childList: true, subtree: true });
    }

    // Initialize player
    function initPlayer() {
      const params = getUrlParams();
      const playerFrame = document.getElementById('playerFrame');
      const loading = document.getElementById('loading');
      const titleEl = document.getElementById('playerTitle');

      // Block ads before loading content
      blockAds();

      // Set title
      titleEl.textContent = params.title;

      // Validate URL
      if (!params.url) {
        showPlayerError('Player URL not provided');
        return;
      }

      // Validate player URL pattern
      const playerUrl = params.url;
      if (!playerUrl.startsWith('https://myembed.biz/filme') &&
          !playerUrl.startsWith('https://myembed.biz/serie')) {
        showPlayerError('Invalid player URL');
        return;
      }

      // Block ads in the iframe content (best effort)
      setTimeout(() => {
        try {
          const iframeDoc = playerFrame.contentDocument || playerFrame.contentWindow.document;
          if (iframeDoc) {
            // Try to remove ad elements inside the iframe
            const iframeAds = iframeDoc.querySelectorAll('iframe, .ads, .ad-banner, .overlay-ad, .ad-overlay');
            iframeAds.forEach(ad => ad.remove());
          }
        } catch (e) {
          // Cross-origin iframe - ad blocking not possible, rely on sandbox and autoplay
        }
      }, 1000);

      // Load iframe
      loading.style.display = 'none';
      playerFrame.style.display = 'block';
      playerFrame.src = playerUrl;
    }

    // Show error state
    function showPlayerError(message) {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const errorMessage = document.getElementById('errorMessage');

      loading.style.display = 'none';
      error.style.display = 'block';
      errorMessage.textContent = message;
    }

    // Navigate back
    function goBack() {
      window.history.back();
    }

    // Event listeners
    document.getElementById('backBtn').addEventListener('click', goBack);
    document.getElementById('errorBtn').addEventListener('click', goBack);

    // Initialize on load
    window.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
